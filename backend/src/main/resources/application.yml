server:
  port: 8080
  shutdown: graceful
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax

spring:
  application:
    name: resume-studio-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/resume_studio?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:resume_studio}
    password: ${DB_PASSWORD:resume_studio_change_me}
    hikari:
      pool-name: ResumeHikariPool
      maximum-pool-size: ${DB_POOL_MAX:20}
      minimum-idle: 4
      connection-timeout: 3000
      validation-timeout: 1500
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 2
  session:
    redis:
      namespace: resume-studio:session
      flush-mode: on_save
      save-mode: on_set_attribute
  cache:
    type: redis
    redis:
      time-to-live: 10m
      cache-null-values: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_SIZE:8MB}
      max-request-size: ${MAX_REQUEST_SIZE:10MB}

  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Shanghai

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-username: ${APP_ADMIN_USERNAME:}
    admin-password: ${APP_ADMIN_PASSWORD:}
  security:
    login-max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
    login-lock-minutes: ${LOGIN_LOCK_MINUTES:15}
    login-attempt-store: ${LOGIN_ATTEMPT_STORE:redis}
    login-attempt-key-prefix: ${LOGIN_ATTEMPT_KEY_PREFIX:resume-studio:login-attempt:}
    username-max-length: ${USERNAME_MAX_LENGTH:80}
    password-max-length: ${PASSWORD_MAX_LENGTH:200}
    new-password-min-length: ${NEW_PASSWORD_MIN_LENGTH:12}
    new-password-max-length: ${NEW_PASSWORD_MAX_LENGTH:72}
  storage:
    type: ${STORAGE_TYPE:local}
    max-image-bytes: ${MAX_IMAGE_BYTES:8388608}
    max-image-dimension: ${MAX_IMAGE_DIMENSION:8000}
    image-cache-max-age-days: ${IMAGE_CACHE_MAX_AGE_DAYS:365}
    allowed-formats: ${STORAGE_ALLOWED_FORMATS:jpg,png,webp}
    allowed-content-types: ${STORAGE_ALLOWED_CONTENT_TYPES:image/jpeg,image/png,image/webp}
    local:
      root: ${STORAGE_LOCAL_ROOT:./data/uploads}
    oss:
      endpoint: ${OSS_ENDPOINT:}
      bucket: ${OSS_BUCKET:}
      access-key-id: ${OSS_ACCESS_KEY_ID:}
      access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
      public-base-url: ${OSS_PUBLIC_BASE_URL:}
      key-prefix: ${OSS_KEY_PREFIX:resume/avatar/}
  cache:
    resume-ttl: ${RESUME_CACHE_TTL:10m}
  validation:
    resume-title-max-length: ${RESUME_TITLE_MAX_LENGTH:120}
    full-name-max-length: ${FULL_NAME_MAX_LENGTH:100}
    headline-max-length: ${HEADLINE_MAX_LENGTH:160}
    email-max-length: ${EMAIL_MAX_LENGTH:160}
    phone-max-length: ${PHONE_MAX_LENGTH:50}
    degree-max-length: ${DEGREE_MAX_LENGTH:50}
    gpa-max-length: ${GPA_MAX_LENGTH:40}
    credit-max-length: ${CREDIT_MAX_LENGTH:20}
    score-max-length: ${SCORE_MAX_LENGTH:20}
    location-max-length: ${LOCATION_MAX_LENGTH:120}
    url-max-length: ${URL_MAX_LENGTH:300}
    summary-max-length: ${SUMMARY_MAX_LENGTH:4000}
    avatar-url-max-length: ${AVATAR_URL_MAX_LENGTH:500}
    item-name-max-length: ${ITEM_NAME_MAX_LENGTH:160}
    item-role-max-length: ${ITEM_ROLE_MAX_LENGTH:120}
    skill-name-max-length: ${SKILL_NAME_MAX_LENGTH:80}
    course-name-max-length: ${COURSE_NAME_MAX_LENGTH:120}
    category-max-length: ${CATEGORY_MAX_LENGTH:80}
    date-max-length: ${DATE_MAX_LENGTH:20}
    description-max-length: ${DESCRIPTION_MAX_LENGTH:2000}
    project-description-max-length: ${PROJECT_DESCRIPTION_MAX_LENGTH:2500}
    tech-stack-max-length: ${TECH_STACK_MAX_LENGTH:300}
    link-max-length: ${LINK_MAX_LENGTH:500}
    max-education-entries: ${MAX_EDUCATION_ENTRIES:20}
    max-campus-entries: ${MAX_CAMPUS_ENTRIES:20}
    max-course-entries: ${MAX_COURSE_ENTRIES:40}
    max-skill-entries: ${MAX_SKILL_ENTRIES:40}
    max-project-entries: ${MAX_PROJECT_ENTRIES:30}
    min-skill-level: ${MIN_SKILL_LEVEL:1}
    max-skill-level: ${MAX_SKILL_LEVEL:5}




